[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "dcd"
version = "0.1.0"
description = "Decomposition-Based Causal Discovery (DCD) for Time Series"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [
    { name = "Anonymous (double-blind review)" }
]
keywords = [
    "causal discovery",
    "time series",
    "STL decomposition",
    "PCMCI",
    "DYNOTEARS",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
]
dependencies = [
    "numpy>=1.23",
    "pandas>=1.5",
    "scipy>=1.10",
    "scikit-learn>=1.2",
    "statsmodels>=0.14",
    "tigramite>=5.2",
    "causalnex>=0.12",
    "causal-learn>=0.1.3",
    "dcor>=0.6",
    "networkx>=3.0",
    "matplotlib>=3.6",
]

[project.optional-dependencies]
notebooks = ["jupyter>=1.0", "ipykernel>=6.0"]

[project.urls]
Homepage = "https://github.com/noname2122/DCD-TMLR-2025"
Repository = "https://github.com/noname2122/DCD-TMLR-2025"

[project.scripts]
dcd = "dcd.core:main"

[tool.setuptools.packages.find]
where = ["src"]
